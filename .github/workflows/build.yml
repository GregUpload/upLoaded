
name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Install MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Prepare Python payload
        shell: pwsh
        run: |
          python --version
          python -m pip install --upgrade pip
          python prepare_payload.py

      - name: Compile Windows executable
        shell: pwsh
        run: |
          $gcc = "C:\msys64\ucrt64\bin\gcc.exe"
          $windres = "C:\msys64\ucrt64\bin\windres.exe"

          & $windres resources.rc -O coff -o resources.o
          if ($LASTEXITCODE -ne 0) {
              throw "Erreur pendant windres"
          }

          & $gcc launcher.c resources.o `
              -o Application.exe `
              -municode -mwindows -O2 -Wall -Wextra -lshell32

          if ($LASTEXITCODE -ne 0) {
              throw "Erreur pendant la compilation GCC"
          }

      - name: Upload Application.exe
        uses: actions/upload-artifact@v4
        with:
          name: Application-Windows-x64
          path: Application.exe
          if-no-files-found: error
          retention-days: 30
          
